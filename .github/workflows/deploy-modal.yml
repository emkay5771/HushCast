name: Deploy Modal Cloud Worker

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-worker/**'
      - '.github/workflows/deploy-modal.yml'
      - '!desktop-worker/**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop-worker/**'
      - '.github/workflows/deploy-modal.yml'
      - '!desktop-worker/**/*.md'
  workflow_dispatch:

concurrency:
  group: modal-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test desktop-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies and run pytest
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --extra dev pytest

  deploy:
    name: Deploy to Modal
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install locked Modal CLI
        run: uv sync --frozen --group deploy

      - name: Deploy Modal worker
        id: deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "MODAL_TOKEN_ID / MODAL_TOKEN_SECRET not configured; skipping Modal deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --frozen --group deploy modal deploy modal_app.py 2>&1 | tee "$RUNNER_TEMP/modal-deploy.log"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          # `modal deploy` prints the web endpoint, e.g. https://<workspace>--hushcast-worker-fastapi-app.modal.run
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.modal\.run' "$RUNNER_TEMP/modal-deploy.log" | grep -i 'fastapi-app' | head -n 1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # V19: fail the deploy if the live worker doesn't answer /v1/health with the current schema.
      # /v1/health needs no token. The URL comes from the MODAL_WORKER_URL secret when it's set
      # (e.g. a custom domain), else from the `modal deploy` output above.
      - name: Smoke-test deployed /v1/health
        if: steps.deploy.outputs.deployed == 'true'
        env:
          MODAL_WORKER_URL: ${{ secrets.MODAL_WORKER_URL }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        run: |
          url="${MODAL_WORKER_URL:-$DEPLOYED_URL}"
          if [ -z "$url" ]; then
            echo "::warning title=Modal smoke test skipped::No MODAL_WORKER_URL secret and no *.modal.run URL in the modal deploy output."
            exit 0
          fi
          uv run --frozen --group deploy hushcast-worker health-check --url "$url" --expect-deployment modal --attempts 6 --delay 10
