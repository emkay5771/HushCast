name: Deploy Modal Cloud Worker

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-worker/**'
      - '.github/workflows/deploy-modal.yml'
      - '!desktop-worker/**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop-worker/**'
      - '.github/workflows/deploy-modal.yml'
      - '!desktop-worker/**/*.md'
  workflow_dispatch:

concurrency:
  group: modal-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test desktop-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

  deploy:
    name: Deploy to Modal
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        run: python -m pip install --upgrade pip "modal==1.6.4"

      - name: Deploy Modal worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "MODAL_TOKEN_ID / MODAL_TOKEN_SECRET not configured; skipping Modal deploy."
            exit 0
          fi
          modal deploy modal_app.py
