name: Deploy Modal Cloud Worker

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-worker/**'
      - '.github/workflows/deploy-modal.yml'
      - '!desktop-worker/**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop-worker/**'
      - '.github/workflows/deploy-modal.yml'
      - '!desktop-worker/**/*.md'
  workflow_dispatch:

concurrency:
  group: modal-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test desktop-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies and run pytest
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --extra dev pytest

  deploy:
    name: Deploy to Modal
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install locked Modal CLI
        run: uv sync --frozen --group deploy

      - name: Deploy Modal worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "MODAL_TOKEN_ID / MODAL_TOKEN_SECRET not configured; skipping Modal deploy."
            exit 0
          fi
          uv run --frozen --group deploy modal deploy modal_app.py
