name: Build & Release HushCast APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/release-apk.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK 36, NDK 27 & CMake
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-36-ndk-27.2.12479018-cmake-3.22.1

      - name: Install Android SDK 36, NDK 27 & CMake
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Cache native CMake build (.cxx)
        uses: actions/cache@v4
        with:
          path: core/automute-engine/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('core/automute-engine/CMakeLists.txt', 'core/automute-engine/src/main/cpp/**', 'core/automute-engine/third_party/**') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "PODCAST_INDEX_API_KEY=${{ secrets.PODCAST_INDEX_API_KEY }}" >> local.properties
          echo "PODCAST_INDEX_API_SECRET=${{ secrets.PODCAST_INDEX_API_SECRET }}" >> local.properties

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          fi

      - name: Run unit tests and lint
        run: ./gradlew :core:automute-engine:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug

      - name: Build Release APK (tags) or Publish APK (PR/push)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -f app/keystore.jks ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assemblePublish
          fi

      - name: Prepare APK artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-main}"
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/HushCast-${TAG_NAME}.apk"
          else
            cp app/build/outputs/apk/publish/app-publish.apk "dist/HushCast-${TAG_NAME}-publish.apk"
          fi

      - name: Upload APKs as workflow artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hushcast-apks
          path: dist/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: hushcast-apks
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            awk '/^---$/{exit} {print}' RELEASE_NOTES.md > /tmp/release_notes.md
          else
            cat <<'EOF' > /tmp/release_notes.md
          HushCast Android APK (`arm64-v8a`, Android 14+ / API 34+).

          ### First-Time Setup
          1. Download `HushCast-${GITHUB_REF_NAME}.apk` on your Android phone and install it.
          2. Open **Settings → HushCast** to download the on-device AI models over Wi-Fi.
          EOF
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "HushCast ${GITHUB_REF_NAME}" \
              --notes-file /tmp/release_notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.apk \
              --title "HushCast ${GITHUB_REF_NAME}" \
              --notes-file /tmp/release_notes.md
          fi
